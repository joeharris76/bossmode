name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify exact release revision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Verify exact release tag revision
        run: |
          package_version=$(uv run --no-project python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF" = "refs/tags/${{ github.event.release.tag_name }}"
          test "$GITHUB_REF_NAME" = "v$package_version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: uv lock --check
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Run UAT harness
        run: uv run python scripts/run_uat.py
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate distributions
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 1
          uvx --from twine==7.0.0 twine check dist/*
      - name: Run installed wheel smoke test
        run: |
          wheel_path=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel_path"
          output_path="$RUNNER_TEMP/bossmode-wheel.json"
          uv run --isolated --no-project --with "$wheel_path" \
            bossmode --db "$RUNNER_TEMP/bossmode-wheel.db" > "$output_path"
          uv run --no-project python -m json.tool "$output_path"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release to PyPI
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/bossmode
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
