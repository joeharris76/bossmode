[project]
name = "bossmode"
version = "0.1.0"
description = "A multi-agent supervisor and durable control plane for task state, evaluation, and gated workflow learning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bossmode = "bossmode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bossmode"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers --cov=bossmode --cov=scripts --cov-report=term-missing:skip-covered --cov-fail-under=90"
testpaths = ["tests"]
timeout = 30
filterwarnings = ["error"]
markers = [
    "integration: crosses a process or packaging boundary",
    "uat: runs the in-process functional acceptance harness",
]

[tool.coverage.run]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.4",
]
