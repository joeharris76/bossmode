[project]
name = "bossmode"
version = "0.1.0"
description = "A multi-agent supervisor and durable control plane for task state, evaluation, and gated workflow learning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bossmode = "bossmode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bossmode"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]
